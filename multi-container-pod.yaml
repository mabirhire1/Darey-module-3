apiVersion: v1  
kind: Pod  
metadata:  
  name: multi-container-pod  
spec:  
  containers:  
  - name: container-1  
    image: nginx  
  - name: container-2  
    image: busybox  
    command:  
      - /bin/sh  
      - -c  
      - "while true; do echo 'Hello from Container 2' >> /usr/share/nginx/html/index.html; sleep 10; done"